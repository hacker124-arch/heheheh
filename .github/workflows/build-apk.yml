name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted_project
          unzip -q "Quantum_Fake_GPS_Android_Project.zip" -d extracted_project

          # Locate the folder containing gradlew (handles nested folders inside the ZIP)
          GRADLE_DIR=$(dirname "$(find extracted_project -maxdepth 3 -name 'gradlew' | head -n 1)")
          if [ -z "$GRADLE_DIR" ] || [ "$GRADLE_DIR" = "." ]; then
            echo "Error: gradlew not found inside the ZIP archive."
            exit 1
          fi
          echo "PROJECT_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
